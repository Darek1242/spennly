<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Miękki cień dodający efektu delikatnego 3D -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Zielone tło z zaokrąglonymi rogami -->
  <rect width="500" height="500" rx="90" ry="90" fill="#008037" />

  <g filter="url(#soft-shadow)">
    <!-- Górny element litery S -->
    <path d="M 200,35
             L 370,35
             A 55,55 0 0,1 425,90
             A 55,55 0 0,1 370,145
             L 240,145
             C 150,145 105,185 200,245
             C 85,210 60,140 120,75
             C 140,50 165,35 200,35 Z" fill="#FAF8F5" />

    <!-- Dolny element litery S -->
    <path d="M 300,465
             L 130,465
             A 55,55 0 0,1 75,410
             A 55,55 0 0,1 130,355
             L 260,355
             C 350,355 395,315 300,255
             C 415,290 440,360 380,425
             C 360,450 335,465 300,465 Z" fill="#FAF8F5" />

    <!-- Miętowe koło w samym środku -->
    <circle cx="250" cy="250" r="48" fill="#9DE3C0" />
  </g>
</svg>